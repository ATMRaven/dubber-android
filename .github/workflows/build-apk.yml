name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Dubber APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dubber-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dubber.apk
          gh release create v1.4.2 Dubber.apk \
            --title "Dubber Android v1.4.2" \
            --notes "Dubber v1.4.2: Integrated Groq Canopy Orpheus ultra-fast neural speech synthesis for Arabic and English, made Groq Arabic (Fahad, Noura, Sultan, Lulwa, Aisha) the default for Arabic over ElevenLabs, added high-speed English Orpheus voices, updated Cloudflare Worker edge routes, and synchronized Android internal screen audio service." \
            || gh release upload v1.4.2 Dubber.apk --clobber
          gh release upload v1.4.1 Dubber.apk --clobber || true
          gh release upload v1.4.0 Dubber.apk --clobber || true
          gh release upload v1.3.9 Dubber.apk --clobber || true
          gh release upload v1.3.8 Dubber.apk --clobber || true
          gh release upload v1.3.7 Dubber.apk --clobber || true
          gh release upload v1.3.6 Dubber.apk --clobber || true
          gh release upload v1.3.5 Dubber.apk --clobber || true
          gh release upload v1.3.4 Dubber.apk --clobber || true
          gh release upload v1.3.3 Dubber.apk --clobber || true
          gh release upload v1.3.2 Dubber.apk --clobber || true
